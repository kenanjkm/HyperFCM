name: Notification or interface problem
description: Report a problem with HyperFCM
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: HyperOS version, device, HyperFCM version and LSPosed version
      placeholder: "OS4.0.5.0, Xiaomi 17 Pro Max, HyperFCM 1.0.0, LSPosed 1.11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened and when
      description: Name the app, say whether the phone was rebooted, whether the screen was off and whether the app was stopped or in the background.
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: Hook status
      description: Open HyperFCM, tap the Hook status card and paste or screenshot the list.
  - type: textarea
    id: logs
    attributes:
      label: Report file and screenshots
      description: "Output of scripts/collect-report.sh. Remove private information first; never upload signing keys or account data."
