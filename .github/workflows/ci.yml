name: Android CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNINGKEYBASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          VERSION_NAME=$(grep -Eo 'versionName "[^"]+"' app/build.gradle | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          APK="app/build/outputs/apk/release/HyperFCM-$VERSION_NAME.apk"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Signing secrets are missing; uploading the unsigned APK instead"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK"
            exit 0
          fi
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK" | head -2
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: HyperFCM-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/HyperFCM-${{ env.VERSION_NAME }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
      # A release is published only for a version tag (v1.0.0), never for ordinary pushes.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "HyperFCM ${{ env.VERSION_NAME }}"
          files: app/build/outputs/apk/release/HyperFCM-${{ env.VERSION_NAME }}.apk
